<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Toggle - React</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { transition: all 0.3s ease; }
        .light-theme { background: #f8f9fa; color: #333; }
        .dark-theme { background: #1a1a2e; color: #fff; }
        .main-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 500px; margin: 0 auto; transition: all 0.3s ease; }
        .light-card { background: white; color: #333; }
        .dark-card { background: #16213e; color: #fff; }
        .card-header { padding: 20px; border-radius: 15px 15px 0 0; transition: all 0.3s ease; }
        .light-header { background: #007bff; color: white; }
        .dark-header { background: #0f3460; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        function ThemeToggle() {
            const [isDark, setIsDark] = useState(false);
            
            // Persist theme in localStorage
            useEffect(() => {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') setIsDark(true);
            }, []);
            
            useEffect(() => {
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }, [isDark]);
            
            const toggleTheme = () => {
                setIsDark(!isDark);
            };
            
            const theme = isDark ? 'dark' : 'light';
            
            return (
                <div className={isDark ? 'dark-theme' : 'light-theme'} style={{minHeight: '100vh', padding: '20px'}}>
                    <div className={`main-card ${isDark ? 'dark-card' : 'light-card'}`}>
                        <div className={`card-header ${isDark ? 'dark-header' : 'light-header'}`}>
                            <h2 className="mb-1">🌓 Theme Toggle</h2>
                            <p className="mb-0">Light & Dark Mode with React Hooks</p>
                        </div>
                        
                        <div className="p-4">
                            <div className="text-center mb-4">
                                <button 
                                    className={`btn ${isDark ? 'btn-light' : 'btn-dark'} btn-lg`}
                                    onClick={toggleTheme}
                                >
                                    {isDark ? '☀️ Switch to Light Mode' : '🌙 Switch to Dark Mode'}
                                </button>
                            </div>
                            
                            <div className="text-center">
                                <h4>Current Theme: <span className="badge bg-primary">{theme.toUpperCase()}</span></h4>
                            </div>
                            
                            <div className="mt-4 p-3 rounded" style={{background: isDark ? '#0f3460' : '#e9ecef'}}>
                                <h5>Sample Content</h5>
                                <p>This content adapts to the current theme. The background and text colors change dynamically based on the selected theme.</p>
                                <ul>
                                    <li>Theme persists during re-renders</li>
                                    <li>Smooth transitions between modes</li>
                                    <li>Uses useState and useEffect hooks</li>
                                </ul>
                            </div>
                            
                            <div className="mt-4 text-center">
                                <div className="form-check form-switch">
                                    <input 
                                        className="form-check-input" 
                                        type="checkbox" 
                                        id="themeSwitch"
                                        checked={isDark}
                                        onChange={toggleTheme}
                                    />
                                    <label className="form-check-label" for="themeSwitch">
                                        Toggle Theme
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ThemeToggle />);
    </script>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
